<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <title>My Buses</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="top">
    <header>
      <h1>My Buses</h1>
      <span id="status" class="status" aria-live="polite"></span>
      <button id="logs-btn" type="button" class="logs-btn">Logs</button>
    </header>
    <nav id="tabs" class="tabs" role="tablist" aria-label="Pages" hidden>
      <span id="tab-pill" class="tab-pill" aria-hidden="true"></span>
      <button type="button" role="tab" data-tab="bus" aria-controls="page-bus">Bus arrivals</button>
      <button type="button" role="tab" data-tab="trip" aria-controls="trip">Trip departures</button>
    </nav>
  </div>

  <main>
   <div id="pager" class="pager">
    <section id="page-bus" class="panel" role="tabpanel">
      <h2>Bus arrival notifier</h2>
      <div id="stops" aria-label="Bookmarked stops"></div>
      <div class="add">
        <label for="q">Add a stop</label>
        <input id="q" type="search" inputmode="search" placeholder="Stop name or 5-digit code" autocomplete="off">
        <ul id="results"></ul>
      </div>
    </section>

    <section id="trip" class="panel trip" role="tabpanel" hidden>
      <h2>Trip departure notifier</h2>
      <div id="cal"></div>
      <label for="trip-from">From</label>
      <select id="trip-from"></select>
      <label for="trip-to">To</label>
      <input id="trip-to" type="search" inputmode="search" placeholder="Address, building or postal code" autocomplete="off">
      <ul id="trip-results"></ul>
      <div id="trip-chosen"></div>
      <div id="trip-places" class="chips"></div>
      <div class="window-row">
        <label><input type="radio" name="trip-when" value="now" checked> Leave now</label>
        <label><input type="radio" name="trip-when" value="arrive"> Arrive by</label>
        <input id="trip-time" type="time" aria-label="Arrive by time">
      </div>
      <button id="trip-go" type="button">Find public transport route</button>
      <div id="trip-alert" aria-live="polite"></div>
      <div id="trip-out" aria-live="polite"></div>
    </section>
   </div>
  </main>

  <dialog id="log-dialog" class="log" aria-labelledby="log-title">
    <div class="log-top">
      <h2 id="log-title">Logs</h2>
      <button id="log-close" type="button" class="link">Close</button>
    </div>
    <div id="log-out"></div>
  </dialog>

  <script src="/app.js" type="module"></script>
</body>
</html>
