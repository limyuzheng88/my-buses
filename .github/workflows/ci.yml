# Runs on every pull request, including drafts: each time the pull request is opened or new commits are pushed to it.
# For unfinished work, open a draft pull request to get these results early; a draft cannot be merged by accident.
# A pull request cannot be merged unless these pass (once branch protection requires "Test and build" and "Screen tests").
name: CI

on:
  pull_request:

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run all test suites
        run: npm test
      - name: Build the Worker
        run: npm run build
        env:
          GIT_SHA: ${{ github.sha }}
      - name: Keep the built Worker for inspection
        uses: actions/upload-artifact@v4
        with:
          name: worker
          path: dist/worker.js
          retention-days: 7

  screens:
    name: Screen tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Playwright drives a real Chromium. It is installed only here, so the app itself still has no dependencies.
      - name: Install the test browser
        run: |
          npm install --no-save --no-package-lock playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: Run the screen tests (phone-sized browser)
        run: npm run test:ui
